server {
    listen __RAILWAY_PORT__;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr;

    client_max_body_size 100M;

    # =====================================================
    # ROOT
    # =====================================================

    location = / {
        return 302 /managepanel/;
    }

    # =====================================================
    # 3X-UI PANEL
    #
    # External:
    #   https://your-domain/managepanel/
    #
    # Internal:
    #   http://127.0.0.1:2053/
    # =====================================================

    location = /managepanel {
        return 301 /managepanel/;
    }

    location /managepanel/ {

        # Remove /managepanel/ before sending to 3x-ui.
        # Therefore:
        #
        # /managepanel/       -> /
        # /managepanel/login  -> /login
        # /managepanel/assets -> /assets

        proxy_pass http://127.0.0.1:2053/;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $http_host;

        proxy_set_header X-Forwarded-Prefix /managepanel;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_redirect off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =====================================================
    # SUBSCRIPTION
    # =====================================================

    location = /sub {
        return 301 /sub/;
    }

    location /sub/ {

        proxy_pass http://127.0.0.1:2096;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $http_host;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_redirect off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # =====================================================
    # WEBSOCKET INBOUND PATHS
    #
    # These are ONLY for WS/HTTP based inbounds.
    #
    # Cbee1  -> 18080
    # Cbee2  -> 18081
    # ...
    # Cbee15 -> 18094
    #
    # 8080 is RESERVED EXCLUSIVELY FOR TCP PROXY.
    # =====================================================

    location = /Cbee1 {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /Cbee2 {
