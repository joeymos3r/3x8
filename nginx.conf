server {
    listen 3000;
    server_name _;

    # لاگ‌ها به خروجی استاندارد (قابل مشاهده در docker logs)
    access_log /dev/stdout;
    error_log /dev/stdout info;

    # مدیریت پنل – پیشوند /managepanel/ حذف می‌شود
    location /managepanel/ {
        rewrite ^/managepanel/(.*) /$1 break;
        proxy_pass http://127.0.0.1:2053;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ساب‌اسکریپشن – پیشوند /sub/ حذف می‌شود
    location /sub/ {
        rewrite ^/sub/(.*) /$1 break;
        proxy_pass http://127.0.0.1:2096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # مسیرهای WebSocket (باید با مقادیر واقعی تنظیمات x-ui جایگزین شوند)
    location ~ ^/(cdn|your-ws-path) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # جلوگیری از دسترسی به روت
    location / {
        return 404;
    }
}
